name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome runs once from the workspace root over apps/** and packages/**.
      - name: Biome check
        run: pnpm exec biome check

      # Turbo fans these out across both apps; one install beats three cold jobs.
      - name: Typecheck and build
        run: pnpm turbo run typecheck build
