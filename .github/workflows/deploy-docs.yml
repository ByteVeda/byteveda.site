name: Deploy docs portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/deploy-docs.yml"
      - "scripts/pull-tool-docs.sh"
  # Picks up docs published by the tool repos since the last portal build.
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm turbo run build --filter=@byteveda/docs

      # docs.byteveda.org/<slug>/ cannot be served by the tool repos — one custom
      # domain belongs to one repository — so their builds are mirrored in here.
      - name: Pull per-tool docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_ARTIFACT_TOKEN }}
        run: bash scripts/pull-tool-docs.sh apps/docs/out

      # `public/CNAME` is copied into the export, which is what keeps the
      # docs.byteveda.org custom domain bound after each deploy.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
