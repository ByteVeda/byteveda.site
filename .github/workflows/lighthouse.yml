name: Lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Audit a deployed origin instead of a locally built one. The input is a plain
  # URL, so a Vercel preview, a Pages deploy and a staging box are all the same
  # thing here — nothing in this workflow knows who the host is.
  workflow_dispatch:
    inputs:
      target_url:
        description: "Origin to audit, e.g. https://byteveda.org (blank = build and serve locally)"
        required: false
        type: string

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # One app's budget blowing up should not hide the other two.
      fail-fast: false
      matrix:
        include:
          - app: main
            filter: "@byteveda/main"
          - app: docs
            filter: "@byteveda/docs"
          - app: flexiq
            filter: "@byteveda/flexiq-site"
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LHCI_TARGET_URL: ${{ inputs.target_url }}
    steps:
      - uses: actions/checkout@v7

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Skipped when auditing a deployed origin — there is nothing local to serve.
      - name: Build
        if: inputs.target_url == ''
        run: pnpm turbo run build --filter=${{ matrix.filter }}

      - name: Lighthouse
        run: pnpm --filter ${{ matrix.filter }} lighthouse

      # The run prints a temporary-public-storage link per URL, but that expires;
      # the raw reports are what you diff when a budget moves.
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.app }}
          path: apps/${{ matrix.app }}/.lighthouseci
          if-no-files-found: ignore
          retention-days: 14
