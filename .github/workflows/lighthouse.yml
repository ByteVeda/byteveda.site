name: Lighthouse

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Audit a deployed origin instead of a locally built one. The input is a plain
  # URL, so a Vercel preview, a Pages deploy and a staging box are all the same
  # thing here — nothing in this workflow knows who the host is.
  workflow_dispatch:
    inputs:
      target_url:
        description: "Origin to audit, e.g. https://byteveda.org (blank = build and serve locally)"
        required: false
        type: string

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      # One app's budget blowing up should not hide the other three.
      fail-fast: false
      matrix:
        include:
          - app: main
            filter: "@byteveda/main"
          - app: docs
            filter: "@byteveda/docs"
          - app: flexiq
            filter: "@byteveda/flexiq-site"
          # The console. Without ADMIN_SESSION_COOKIE the run covers /login and
          # stops there, which is the whole of it that a cold visitor waits on —
          # and it still catches a dependency that doubles the shared bundle.
          # The pages behind the login are a `workflow_dispatch` away; see
          # apps/admin/lighthouserc.js.
          - app: admin
            filter: "@byteveda/admin"
    env:
      NEXT_TELEMETRY_DISABLED: 1
      LHCI_TARGET_URL: ${{ inputs.target_url }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `--affected` diffs against a base commit, which has to be in the clone.
          fetch-depth: 0

      # Version comes from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve comparison base
        run: .github/scripts/resolve-scm-base.sh
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Four builds and twelve Lighthouse runs is the expensive half of this
      # workflow. Skip the ones a change cannot reach — but never when a target
      # URL was dispatched, since that audits a deployment, not this diff.
      - name: Check whether ${{ matrix.app }} is affected
        id: affected
        run: |
          if [ -n "$LHCI_TARGET_URL" ]; then
            echo "Auditing a dispatched target; running regardless of the diff."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if pnpm turbo run lighthouse --affected --dry=json \
            | jq -e --arg pkg '${{ matrix.filter }}' \
              '[.tasks[] | select(.command != "<NONEXISTENT>") | .package] | index($pkg)' > /dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.filter }} is untouched by this change; skipping."
          fi

      # Skipped when auditing a deployed origin — there is nothing local to serve.
      - name: Build
        if: steps.affected.outputs.run == 'true' && inputs.target_url == ''
        run: pnpm turbo run build --filter=${{ matrix.filter }}

      - name: Lighthouse
        if: steps.affected.outputs.run == 'true'
        run: pnpm --filter ${{ matrix.filter }} lighthouse

      # The run prints a temporary-public-storage link per URL, but that expires;
      # the raw reports are what you diff when a budget moves.
      - name: Upload reports
        if: always() && steps.affected.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.app }}
          path: apps/${{ matrix.app }}/.lighthouseci
          if-no-files-found: ignore
          retention-days: 14
