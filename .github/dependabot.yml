version: 2

updates:
  # One entry for the whole pnpm workspace. Listing members individually makes
  # Dependabot resolve each in isolation, where `catalog:` specs have no root
  # pnpm-workspace.yaml to resolve against (ERR_PNPM_CATALOG_ENTRY_NOT_FOUND_FOR_SPEC).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
    groups:
      next-react:
        patterns:
          - next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"
      biome:
        patterns:
          - "@biomejs/*"
      types:
        patterns:
          - "@types/node"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
