packages:
  - apps/*
  - packages/*

# pnpm 11 no longer reads the `pnpm` field in package.json; overrides live here.
overrides:
  postcss@<8.5.10: ">=8.5.10"

# Single source of truth for the versions both apps share. Bump here rather than in
# the individual package.json files so `main` and `docs` cannot drift apart again.
catalog:
  "@fontsource-variable/ibm-plex-sans": ^5.3.0
  "@fontsource/ibm-plex-mono": ^5.3.0
  "@tailwindcss/postcss": ^4
  "@types/node": ^24
  "@types/react": ^19
  "@types/react-dom": ^19
  lucide-react: ^1.34.0
  motion: ^12.34.5
  gray-matter: ^4.0.3
  next-mdx-remote: ^6.0.0
  remark-gfm: ^4.0.1
  next: ^16.3.4
  "@react-three/fiber": ^9.3.0
  three: ^0.185.1
  "@types/three": ^0.182.0
  next-themes: ^0.4.6
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: ^4
  typescript: ^6
  vitest: ^5.0.0
  "@playwright/test": ^1.58.0
  "@vercel/speed-insights": ^2.0.0
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  pg: ^8.23.0
  "@types/pg": ^8.23.1

# Replaces ignoredBuiltDependencies, removed in pnpm 11. Each ships prebuilt
# binaries, so their install scripts stay off.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
