packages:
  - apps/*
  - packages/*

# Single source of truth for the versions both apps share. Bump here rather than in
# the individual package.json files so `main` and `docs` cannot drift apart again.
catalog:
  "@tailwindcss/postcss": ^4
  "@types/node": ^26
  "@types/react": ^19
  "@types/react-dom": ^19
  lucide-react: ^1.28.0
  next: ^16.3.0
  next-themes: ^0.4.6
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: ^4
  typescript: ^6

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
